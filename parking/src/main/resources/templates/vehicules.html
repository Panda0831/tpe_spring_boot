<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head th:replace="~{fragments/layout :: head('Véhicules')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<div th:replace="~{fragments/layout :: flash}"></div>

<main class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Véhicules</h1>
        <span class="text-muted small" th:text="${page.totalElements} + ' véhicule(s)'">0</span>
    </div>

    <form class="row g-2 align-items-end mb-4" method="get" th:action="@{/vehicules}">
        <div class="col-8 col-md-4">
            <label class="form-label mb-1" for="recherche">Recherche</label>
            <input class="form-control" id="recherche" name="recherche" th:value="${recherche}"
                   placeholder="Immatriculation, marque ou modèle">
        </div>
        <div class="col-4 col-md-3 d-flex gap-2">
            <button class="btn btn-primary" type="submit">Rechercher</button>
            <a class="btn btn-outline-secondary" th:href="@{/vehicules}">Réinitialiser</a>
        </div>
    </form>

    <!-- Enregistrement d'un véhicule (MANAGER / ADMIN) -->
    <div class="card mb-4" th:if="${peutGerer}">
        <div class="card-header bg-dark text-white">Enregistrer un véhicule</div>
        <div class="card-body">
            <form class="row g-3" method="post" th:action="@{/vehicules}">
                <div class="col-12 col-md-3">
                    <label class="form-label" for="immatriculation">Immatriculation *</label>
                    <input class="form-control" id="immatriculation" name="immatriculation"
                           minlength="2" maxlength="20" pattern="[A-Za-z0-9 -]{2,20}"
                           title="Utilisez 2 à 20 lettres, chiffres, espaces ou tirets"
                           required placeholder="AB-123-CD">
                </div>
                <div class="col-12 col-md-3">
                    <label class="form-label" for="marque">Marque</label>
                    <input class="form-control" id="marque" name="marque" maxlength="50" placeholder="Peugeot">
                </div>
                <div class="col-12 col-md-3">
                    <label class="form-label" for="modele">Modèle</label>
                    <input class="form-control" id="modele" name="modele" maxlength="50" placeholder="208">
                </div>
                <div class="col-12 col-md-3">
                    <label class="form-label" for="utilisateurId">Propriétaire *</label>
                    <select class="form-select" id="utilisateurId" name="utilisateurId" required>
                        <option value="" disabled selected>Choisir un propriétaire</option>
                        <option th:each="u : ${utilisateurs}" th:value="${u.id}"
                                th:text="${u.nom} + ' ' + ${u.prenom != null ? u.prenom : ''} + ' (' + ${u.email} + ')'">Propriétaire</option>
                    </select>
                </div>
                <div class="col-12 text-end">
                    <button class="btn btn-success" type="submit">Enregistrer le véhicule</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Tableau des véhicules -->
    <div class="table-responsive">
        <table class="table table-hover align-middle">
            <thead class="table-light">
            <tr>
                <th>#</th>
                <th>Immatriculation</th>
                <th>Marque & Modèle</th>
                <th>Propriétaire</th>
                <th class="text-end" th:if="${estAdmin}">Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="v : ${page.content}">
                <td th:text="${v.id}">1</td>
                <td>
                    <span class="badge text-bg-dark font-monospace fs-6" th:text="${v.immatriculation}">AB-123-CD</span>
                </td>
                <td>
                    <span th:text="${v.marque} + ' ' + ${v.modele}">Peugeot 208</span>
                </td>
                <td>
                    <span th:if="${v.utilisateurId != null}" th:text="'Utilisateur #' + ${v.utilisateurId}">Propriétaire</span>
                    <span th:unless="${v.utilisateurId != null}" class="text-muted">—</span>
                </td>
                <td class="text-end" th:if="${estAdmin}">
                    <form th:action="@{/vehicules/{id}/supprimer(id=${v.id})}" method="post"
                          onsubmit="return confirm('Supprimer ce véhicule ?');">
                        <button class="btn btn-sm btn-outline-danger" type="submit">Supprimer</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${page.empty}">
                <td colspan="5" class="text-center text-muted py-4">Aucun véhicule trouvé.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Pagination -->
    <nav th:if="${page.totalPages > 1}" class="d-flex justify-content-center mt-3">
        <ul class="pagination pagination-sm">
            <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                <a class="page-link" th:href="@{/vehicules(page=${page.number - 1}, recherche=${recherche})}">Précédent</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
                th:classappend="${i == page.number} ? 'active'">
                <a class="page-link" th:text="${i + 1}"
                   th:href="@{/vehicules(page=${i}, recherche=${recherche})}">1</a>
            </li>
            <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                <a class="page-link" th:href="@{/vehicules(page=${page.number + 1}, recherche=${recherche})}">Suivant</a>
            </li>
        </ul>
    </nav>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
