services:
  postgres:
    image: postgres:16-alpine
    container_name: taxis_postgres
    environment:
      POSTGRES_DB: taxis_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - taxis_data:/var/lib/postgresql/data

volumes:
  taxis_data:
