<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head th:replace="~{fragments/layout :: head('Connexion')}"></head>
<body class="bg-light">
<div class="container" style="max-width: 460px; margin-top: 6vh;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h1 class="h4 text-center mb-1"><i class="bi bi-car-front-fill text-primary me-2" aria-hidden="true"></i>Gestion de flotte de taxis</h1>
            <p class="text-center text-muted small mb-4">Projet TPE — Spring Boot / Thymeleaf</p>

            <div th:if="${param.error}" class="alert alert-danger">
                Identifiant ou mot de passe incorrect.
            </div>
            <div th:if="${param.logout}" class="alert alert-success">
                Vous avez été déconnecté.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label" for="username">Identifiant</label>
                    <input class="form-control" id="username" name="username" type="text"
                           placeholder="admin" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">Mot de passe</label>
                    <input class="form-control" id="password" name="password" type="password" required>
                </div>
                <button class="btn btn-primary w-100" type="submit">Se connecter</button>
            </form>

            <hr>
            <p class="small text-muted mb-0">
                Comptes de démonstration (mot de passe <code>password</code>) :<br>
                <code>admin</code> · <code>manager</code> · <code>operator</code> ·
                <code>user</code> · <code>chauffeur1</code>
            </p>
        </div>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
